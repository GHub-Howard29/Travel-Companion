<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff3e8" />
    
    <title>我的旅行小幫手</title>
    
    <meta http-equiv="Content-Language" content="zh-Hant">
    
    <meta name="description" content="旅行行程規劃與多人即時記帳同步小幫手">
    <meta property="og:locale" content="zh_TW">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <script>
      (() => {
        const isIosDevice =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (isIosDevice && navigator.standalone === true) {
          document.documentElement.classList.add("ios-standalone-pwa");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        background: #fff3e8;
      }

      body {
        margin: 0;
      }

      #app-launch-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        min-height: 100dvh;
        background: #fff3e8;
      }

      #app-launch-screen img {
        display: none;
      }

      .ios-standalone-pwa #app-launch-screen img {
        display: block;
        width: min(58vw, 280px);
        height: auto;
        border-radius: 22%;
      }
    </style>
  </head>
  <body>
    <div id="app-launch-screen" role="status" aria-label="App 載入中">
      <img src="%BASE_URL%pwa-512x512.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
