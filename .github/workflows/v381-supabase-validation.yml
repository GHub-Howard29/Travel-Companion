name: V3.8.1 Supabase validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v381-supabase-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Baseline, migration, roles, advisors and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.115.0

      - name: Verify runner and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker version
          supabase --version
          npm ci

      - name: Prepare isolated V3.8.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f \
            ! -name '20260910140949_v381_trip_deletion_tombstones.sql' -delete
          cp supabase/tests/v381_ci_base_schema.sql \
            supabase/migrations/20260910000000_v381_ci_base_schema.sql

      - name: Start isolated Supabase stack
        run: supabase start --yes

      - name: Export local-only credentials
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "V381_SUPABASE_URL=${API_URL}"
            echo "V381_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "V381_SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "V381_DB_URL=${DB_URL}"
          } >> "${GITHUB_ENV}"

      - name: Verify API roles, deletion RPC and Broadcast
        run: node scripts/verify-v381-supabase-deletion.mjs

      - name: Run transaction-safe SQL validation
        run: psql "${V381_DB_URL}" -v ON_ERROR_STOP=1 -f docs/sql/025_v381_trip_deletion_tombstones_validation.sql

      - name: Run security and performance advisors
        run: supabase db advisors --local --type all --level warn --fail-on none

      - name: Verify rollback refuses permanent tombstones
        shell: bash
        run: |
          set -euo pipefail
          if psql "${V381_DB_URL}" -v ON_ERROR_STOP=1 \
            -f docs/sql/026_v381_trip_deletion_tombstones_rollback.sql; then
            echo "Rollback unexpectedly erased permanent tombstones" >&2
            exit 1
          fi
          psql "${V381_DB_URL}" -v ON_ERROR_STOP=1 -c \
            "select 1 from public.trip_deletion_tombstones limit 1"

      - name: Rehearse empty-test-environment rollback
        shell: bash
        run: |
          set -euo pipefail
          psql "${V381_DB_URL}" -v ON_ERROR_STOP=1 -c \
            "truncate table public.trip_deletion_tombstones"
          psql "${V381_DB_URL}" -v ON_ERROR_STOP=1 \
            -f docs/sql/026_v381_trip_deletion_tombstones_rollback.sql
          psql "${V381_DB_URL}" -v ON_ERROR_STOP=1 \
            -f docs/sql/027_v381_trip_deletion_tombstones_rollback_validation.sql

      - name: Reapply migration and validate again
        shell: bash
        run: |
          set -euo pipefail
          psql "${V381_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260910140949_v381_trip_deletion_tombstones.sql
          psql "${V381_DB_URL}" -v ON_ERROR_STOP=1 \
            -f docs/sql/025_v381_trip_deletion_tombstones_validation.sql

      - name: Stop and erase isolated Supabase data
        if: always()
        run: supabase stop --no-backup
