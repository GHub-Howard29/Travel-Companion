name: V3.9.1 Supabase validation

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/v391-supabase-validation.yml"
      - "docs/sql/031_v391_commons_precision_infrastructure_validation.sql"
      - "supabase/config.toml"
      - "supabase/migrations/20260915105815_v391_commons_precision_infrastructure.sql"
      - "supabase/tests/v391_ci_base_schema.sql"

permissions:
  contents: read

concurrency:
  group: v391-supabase-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Cache, quota, locks, usage and advisors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.115.0
      - name: Prepare isolated V3.9.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f ! -name '20260915105815_v391_commons_precision_infrastructure.sql' -delete
          cp supabase/tests/v391_ci_base_schema.sql supabase/migrations/20260915100000_v391_ci_base_schema.sql
      - name: Start isolated Supabase stack
        run: supabase start --yes
      - name: Export database URL
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "V391_DB_URL=${DB_URL}" >> "${GITHUB_ENV}"
      - name: Validate server-only infrastructure
        run: psql "${V391_DB_URL}" -v ON_ERROR_STOP=1 -f docs/sql/031_v391_commons_precision_infrastructure_validation.sql
      - name: Run security and performance advisors
        run: supabase db advisors --local --type all --level warn --fail-on none
      - name: Stop and erase isolated Supabase data
        if: always()
        run: supabase stop --no-backup
